</div><label class="picker-select"><span>게임 선택</span><select onchange="game=+this.value;home()">${db.map((g,i)=>`<option value="${i}" ${game===i?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label><div class="picker-stamp" aria-hidden="true">LET’S<br>PLAY<span>✳</span></div></div><div class="grid">${db[game].groupNames.map((n,i)=>`<button class="group-card" onclick="setup(${i})"><span class="group-label">입장권 0${i+1}</span><span class="group-name">${esc(n)}</span><span class="group-count">제시어: ${db[game].groups[i].length}개</span><span class="group-arrow" aria-hidden="true">↗</span><span class="ticket-bottom">LET’S PLAY TOGETHER <span>✳</span></span></button>`).join('')}</div><div class="card rank-card"><div class="section-top"><h2><span>명예의 전당</span></h2><span class="section-tag">순위</span></div>${ranking()}</div><footer class="closing"><span class="mascot" aria-hidden="true">◡</span>몸짓은 크게, <span>웃음은 더 크게!</span><small>${durationText()} · 함께라서 더 재밌는 시간</small></footer>`} function ranking(){let r=db[game].results.slice().sort((a,b)=>b.correct-a.correct||(a.complete&&b.complete?a.elapsed-b.elapsed:0));return r.length?`<div class="rank-list">${r.map((x,i)=>`<div class="rank-item"><div class="rank-number">${i===0?'★':i+1}</div><div><div class="rank-team">${esc(x.team)}</div><div class="rank-group">${esc(x.groupName)} 그룹 · ${i+1}위</div></div><div class="rank-score">${x.correct} <small>/ ${x.total}개</small></div><div class="rank-time">${x.complete?'완주 · '+fmt(x.elapsed):x.stopped?'중도 종료':'시간 종료'}</div></div>`).join('')}</div><p class="rank-note">정답 수가 많은 순 · 모두 맞힌 팀은 완료 시간이 짧은 순</p>`:'<div class="rank-empty"><span class="empty-symbol">☆</span><strong>첫 번째 주인공을 기다려요!</strong><span>게임을 마치면 이곳에 팀의 기록이 남아요.</span></div>'} function setup(i){group=i;app.innerHTML=`<button class="secondary" onclick="home()">← 돌아가기</button><div class="card"><h2>${esc(db[game].groupNames[i])} 그룹</h2><p>제한시간은 ${durationText()}입니다. 팀 이름을 입력하고 시작해 주세요.</p><div class="row"><input id="team" placeholder="팀 이름" maxlength="40"><button class="accent" onclick="start()">시작</button></div></div>`} function fmt(ms){let s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')} function start(){let team=document.getElementById('team').value.trim();if(!team)return alert('팀 이름을 입력해 주세요.');let q=structuredClone(db[game].groups[group]);if(!q.length)return alert('제시어를 먼저 추가해 주세요.');run={team,queue:q,total:q.length,correct:0,start:Date.now(),durationMs:durationSeconds()*1000,end:Date.now()+durationSeconds()*1000};show();tick=setInterval(()=>{if(Date.now()>=run.end)finish(false);else document.getElementById('time').textContent=fmt(run.end-Date.now())},200)} function show(){let w=run.queue[0];app.innerHTML=`<div class="game-top"><div><div class="game-label">${esc(run.team)} · ${esc(db[game].groupNames[group])} 그룹 · 남은 시간</div><div class="timer" id="time">${fmt(Math.max(0,run.end-Date.now()))}</div></div><div class="controls"><button class="accent" onclick="answer()">✓ 정답</button><button class="secondary" onclick="pass()">↻ 패스</button></div></div><div class="score-row"><div class="score">정답<strong>${run.correct}<small> / ${run.total}</small></strong></div><div class="score remaining">남은 제시어<strong>${run.queue.length}<small> 개</small></strong></div></div><div class="card prompt-card"><div class="category">${esc(w.category)} · ${'★'.repeat(+w.difficulty||1)}</div><div class="word">${esc(w.text)}</div>${w.note?`<p>비고: ${esc(w.note)}</p>`:''}${w.image?`<img src="${esc(w.image)}" alt="제시어 이미지" onerror="this.style.display='none'">`:''}</div><div class="game-footer"><button class="end-button" onclick="endGame()">게임 종료</button></div>`} async function endGame(){if(!run)return;if(Date.now()>=run.end)return finish(false);if(await askConfirm('게임을 종료하고 현재 점수를 기록할까요?'))finish(false,true)} function answer(){if(Date.now()>=run.end)return finish(false);run.queue.shift();run.correct++;if(!run.queue.length)finish(true);else show()} function pass(){if(Date.now()>=run.end)return finish(false);run.queue.push(run.queue.shift());show()} function finish(done,stopped=false){clearInterval(tick);let elapsed=Math.min(run.durationMs,Date.now()-run.start),r={team:run.team,group,groupName:db[game].groupNames[group],correct:run.correct,total:run.total,complete:done,elapsed,stopped,durationSeconds:run.durationMs/1000};db[game].results.push(r);save();run=null;app.innerHTML=`<div class="card"><h2>${done?'모두 정답! 🎉':stopped?'게임 종료':'시간 종료!'}</h2><p>${esc(r.team)} · ${r.correct}/${r.total}개</p><p>${done?'완료 기록 '+fmt(elapsed):stopped?'운영자가 종료했습니다':'제한시간 '+fmt(r.durationSeconds*1000)+' 종료'}</p><button onclick="home()">순위 보기</button></div>`} async function openAdmin(){if(run&&!await askConfirm('진행 중인 게임을 종료하고 관리자 화면으로 이동할까요? 현재 점수는 기록됩니다.'))return;if(run){if(Date.now()>=run.end)finish(false);else finish(false,true)}admin()} function admin(){clearInterval(tick);run=null;app.innerHTML=`<button class="secondary" onclick="home()">← 게임으로</button><div class="card"><h2>게임 관리</h2><div class="row"><select onchange="game=+this.value;admin()">${db.map((g,i)=>`<option value="${i}" ${i===game?'selected':''}>${esc(g.name)}</option>`).join('')}</select><button onclick="newGame()">새 게임 만들기</button><button class="secondary" onclick="renameGame()">이름 변경</button><button class="secondary" onclick="clearResults()">기록 초기화</button></div><p class="muted">변경사항은 이 브라우저에 저장됩니다. 이미지 버튼으로 각 제시어에 사진을 추가할 수 있습니다.</p></div><div class="card"><h2>게임 제한시간</h2><p class="muted">현재 게임에 적용할 시간을 설정해 주세요. 다음 게임부터 적용됩니다.</p><div class="row timer-settings"><label>분 <input id="duration-min" type="number" min="0" max="180" step="1" value="${Math.floor(durationSeconds()/60)}" style="width:95px"></label><label>초 <input id="duration-sec" type="number" min="0" max="59" step="1" value="${durationSeconds()%60}" style="width:95px"></label><button onclick="saveDuration()">시간 저장</button><span id="duration-status" role="status" class="muted">현재 제한시간: ${durationText()}</span></div></div><div class="card"><h2>그룹 관리</h2><button onclick="addGroup()">+ 그룹 추가</button></div>${db[game].groupNames.map((n,i)=>`<div class="card"><div class="row"><h2>${esc(n)} · ${db[game].groups[i].length}개</h2><button class="secondary" onclick="renameGroup(${i})">그룹 이름 변경</button><button class="secondary" onclick="deleteGroup(${i})">그룹 삭제</button></div><div style="overflow:auto"><table><tr><th>제시어</th><th>분류</th><th>난이도</th><th>비고</th><th>이미지</th><th></th></tr>${db[game].groups[i].map((w,j)=>`<tr><td><input value="${esc(w.text)}" onchange="edit(${i},${j},'text',this.value)"></td><td><input value="${esc(w.category)}" onchange="edit(${i},${j},'category',this.value)"></td><td><select onchange="edit(${i},${j},'difficulty',+this.value)">${[1,2,3].map(d=>`<option value="${d}" ${d==w.difficulty?'selected':''}>${'★'.repeat(d)}</option>`).join('')}</select></td><td><input value="${esc(w.note)}" onchange="edit(${i},${j},'note',this.value)"></td><td><label>📷<input type="file" accept="image/*" style="width:100px" onchange="upload(${i},${j},this)"></label>${w.image?'✓':''}</td><td><button class="secondary" onclick="removeWord(${i},${j})">삭제</button></td></tr>`).join('')}</table></div><button onclick="addWord(${i})">+ 제시어 추가</button></div>`).join('')}` } function edit(i,j,k,v){db[game].groups[i][j][k]=v;try{save()}catch(e){alert('저장 공간이 부족합니다. 이미지 크기를 줄여 주세요.')}} function upload(i,j,input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{edit(i,j,'image',r.result);admin()};r.readAsDataURL(f)} function addWord(i){db[game].groups[i].push({text:'새 제시어',category:'기타',difficulty:1,note:'',image:''});save();admin()} async function removeWord(i,j){if(await askConfirm('이 제시어를 삭제할까요?')){db[game].groups[i].splice(j,1);save();admin()}} function durationSeconds(){let n=Number(db[game].durationSeconds);return Number.isInteger(n)&&n>=1&&n<=10800?n:600} function durationText(){let n=durationSeconds(),m=Math.floor(n/60),sec=n%60;return (m?m+'분':'')+(m&&sec?' ':'')+(sec?sec+'초':'')} function saveDuration(){let a=document.getElementById('duration-min').value,b=document.getElementById('duration-sec').value,m=Number(a),sec=Number(b),total=m*60+sec;if(a===''||b===''||!Number.isInteger(m)||!Number.isInteger(sec)||m<0||sec<0||sec>59||total<1||total>10800)return alert('1초부터 180분 사이로 입력해 주세요. 초는 0~59 사이여야 합니다.');let old=db[game].durationSeconds;db[game].durationSeconds=total;try{save();document.getElementById('duration-status').textContent=durationText()+'으로 저장했습니다.'}catch(e){db[game].durationSeconds=old;alert('시간을 저장하지 못했습니다. 브라우저 저장 공간을 확인해 주세요.')}} function gameDialog(message,value){return new Promise(resolve=>{const layer=document.createElement('div');layer.className='dialog-shade';layer.innerHTML=`<form class="game-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">${value===undefined?'확인해 주세요':'이름 입력'}</h2><p>${esc(message)}</p>${value===undefined?'':`<input class="dialog-input" aria-label="이름" maxlength="80" value="${esc(value)}" required>`}<div class="row"><button type="button" class="secondary dialog-cancel">취소</button><button type="submit" class="accent">확인</button></div></form>`;const prior=document.activeElement;document.body.append(layer);const input=layer.querySelector('input');const form=layer.querySelector('form');const close=result=>{layer.remove();prior?.focus();resolve(result)};layer.querySelector('.dialog-cancel').onclick=()=>close(value===undefined?false:null);form.onsubmit=e=>{e.preventDefault();close(value===undefined?true:input.value.trim())};layer.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();close(value===undefined?false:null)}if(e.key==='Tab'){const focusable=[...form.querySelectorAll('input,button')],first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}};(input||form.querySelector('button[type="submit"]')).focus();if(input)input.select()})} function askConfirm(message){return gameDialog(message)} function askText(message,value=''){return gameDialog(message,value)} async function newGame(){let n=await askText('새 게임 이름');if(!n?.trim())return;db.push({name:n.trim(),groups:[[],[],[]],groupNames:[...defaultNames],results:[]});game=db.length-1;save();admin()} async function addGroup(){let n=await askText('새 그룹 이름');if(!n?.trim())return;db[game].groupNames.push(n.trim());db[game].groups.push([]);save();admin()} async function renameGroup(i){let n=await askText('그룹 이름',db[game].groupNames[i]);if(!n?.trim())return;db[game].groupNames[i]=n.trim();save();admin()} async function deleteGroup(i){let g=db[game];if(!await askConfirm(`‘${g.groupNames[i]}’ 그룹과 제시어 ${g.groups[i].length}개를 삭제할까요? 기존 순위 기록은 유지됩니다.`))return;g.groupNames.splice(i,1);g.groups.splice(i,1);save();admin()} async function renameGame(){let n=await askText('게임 이름',db[game].name);if(n?.trim()){db[game].name=n.trim();save();admin()}} async function clearResults(){if(await askConfirm('이 게임의 모든 기록을 삭제할까요?')){db[game].results=[];save();admin()}} home();</script></html>
