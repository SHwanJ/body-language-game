ain><header><h1>몸으로 말해요 ✨</h1><button class="secondary" onclick="openAdmin()">관리자</button></header><div id="app"></div></main><script>

ext": "홍학", "category": "동물", "difficulty": 2, "note": "", "image": ""}, {"text": "박쥐", "category": "동물", "difficulty": 2, "note": "", "image": ""}, {"text": "아이언맨", "category": "영화", "difficulty": 2, "note": "", "image": ""}, {"text": "토끼", "category": "동물", "difficulty": 1, "note": "", "image": ""}, {"text": "코끼리", "category": "동물", "difficulty": 1, "note": "", "image": ""}, {"text": "판다", "category": "동물", "difficulty": 2, "note": "", "image": ""}, {"text": "고래 싸움에 새우 등 터진다", "category": "속담", "difficulty": 3, "note": "", "image": ""}, {"text": "해리포터와 비밀의 방", "category": "영화", "difficulty": 3, "note": "", "image": ""}, {"text": "캥거루", "category": "동물", "difficulty": 1, "note": "", "image": ""}, {"text": "알라딘", "category": "영화", "difficulty": 1, "note": "", "image": ""}, {"text": "캐리비안의 해적", "category": "영화", "difficulty": 3, "note": "", "image": ""}]]; const defaultNames=['프','레','인']; let db=JSON.parse(localStorage.getItem('charadesDB')||'null')||[{name:'프레이니용',groups:initial,results:[]}]; for(const g of db){if(!Array.isArray(g.groupNames))g.groupNames=g.groups.map((_,i)=>defaultNames[i]||`그룹 ${i+1}`);for(const r of g.results)if(!r.groupName)r.groupName=g.groupNames[r.group]||'삭제된 그룹'} let game=0,group=0,run=null,tick=null; const app=document.getElementById('app'); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); function save(){localStorage.setItem('charadesDB',JSON.stringify(db))} function home(){clearInterval(tick);run=null;app.innerHTML=`<p class="muted">함께하는 게임, 눈치보지 말고 즐겨봅시다!</p><div class="card game-picker"><div class="picker-copy"><span class="picker-eyebrow">READY TO PLAY</span><strong>게임을 시작할까요?</strong><span>게임을 고르고 아래에서 그룹을 선택해 주세요.</span></div><label class="picker-select"><span>게임 선택</span><select onchange="game=+this.value;home()">${db.map((g,i)=>`<option value="${i}" ${game===i?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label><div class="picker-stamp" aria-hidden="true">LET’S<br>PLAY<span>✳</span></div></div><div class="grid">${db[game].groupNames.map((n,i)=>`<button class="group-card" onclick="setup(${i})"><span class="group-label">GROUP 0${i+1}</span><span class="group-name">${esc(n)}</span><span class="group-count">제시어: ${db[game].groups[i].length}개</span><span class="group-arrow" aria-hidden="true">↗</span></button>`).join('')}</div><div class="card"><h2>순위</h2>${ranking()}</div>`} function ranking(){let r=db[game].results.slice().sort((a,b)=>b.correct-a.correct||(a.complete&&b.complete?a.elapsed-b.elapsed:0));return r.length?`<div class="rank-list">${r.map((x,i)=>`<div class="rank-item"><div class="rank-number">${i===0?'★':i+1}</div><div><div class="rank-team">${esc(x.team)}</div><div class="rank-group">${esc(x.groupName)} 그룹 · ${i+1}위</div></div><div class="rank-score">${x.correct} <small>/ ${x.total}개</small></div><div class="rank-time">${x.complete?'완주 · '+fmt(x.elapsed):x.stopped?'중도 종료':'시간 종료'}</div></div>`).join('')}</div><p class="rank-note">정답 수가 많은 순 · 모두 맞힌 팀은 완료 시간이 짧은 순</p>`:'<div class="rank-empty">🧳<br><br>아직 기록이 없어요.<br>첫 번째 팀의 도전을 기다리고 있습니다.</div>'} function setup(i){group=i;app.innerHTML=`<button class="secondary" onclick="home()">← 돌아가기</button><div class="card"><h2>${esc(db[game].groupNames[i])} 그룹</h2><p>팀 이름을 입력하면 10분 게임이 시작됩니다.</p><div class="row"><input id="team" placeholder="팀 이름" maxlength="40"><button class="accent" onclick="start()">시작</button></div></div>`} function fmt(ms){let s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')} function start(){let team=document.getElementById('team').value.trim();if(!team)return alert('팀 이름을 입력해 주세요.');let q=structuredClone(db[game].groups[group]);if(!q.length)return alert('제시어를 먼저 추가해 주세요.');run={team,queue:q,total:q.length,correct:0,start:Date.now(),end:Date.now()+600000};show();tick=setInterval(()=>{if(Date.now()>=run.end)finish(false);else document.getElementById('time').textContent=fmt(run.end-Date.now())},200)} function show(){let w=run.queue[0];app.innerHTML=`<div class="game-top"><div><div class="game-label">${esc(run.team)} · ${esc(db[game].groupNames[group])} 그룹 · 남은 시간</div><div class="timer" id="time">${fmt(Math.max(0,run.end-Date.now()))}</div></div><div class="controls"><button class="accent" onclick="answer()">✓ 정답</button><button class="secondary" onclick="pass()">↻ 패스</button></div></div><div class="score-row"><div class="score">정답<strong>${run.correct}<small> / ${run.total}</small></strong></div><div class="score remaining">남은 제시어<strong>${run.queue.length}<small> 개</small></strong></div></div><div class="card prompt-card"><div class="category">${esc(w.category)} · ${'★'.repeat(+w.difficulty||1)}</div><div class="word">${esc(w.text)}</div>${w.note?`<p>비고: ${esc(w.note)}</p>`:''}${w.image?`<img src="${esc(w.image)}" alt="제시어 이미지" onerror="this.style.display='none'">`:''}</div><div class="game-footer"><button class="end-button" onclick="endGame()">게임 종료</button></div>`} function endGame(){if(!run)return;if(Date.now()>=run.end)return finish(false);if(confirm('게임을 종료하고 현재 점수를 기록할까요?'))finish(false,true)} function answer(){if(Date.now()>=run.end)return finish(false);run.queue.shift();run.correct++;if(!run.queue.length)finish(true);else show()} function pass(){if(Date.now()>=run.end)return finish(false);run.queue.push(run.queue.shift());show()} function finish(done,stopped=false){clearInterval(tick);let elapsed=Math.min(600000,Date.now()-run.start),r={team:run.team,group,groupName:db[game].groupNames[group],correct:run.correct,total:run.total,complete:done,elapsed,stopped};db[game].results.push(r);save();run=null;app.innerHTML=`<div class="card"><h2>${done?'모두 정답! 🎉':stopped?'게임 종료':'시간 종료!'}</h2><p>${esc(r.team)} · ${r.correct}/${r.total}개</p><p>${done?'완료 기록 '+fmt(elapsed):stopped?'운영자가 종료했습니다':'10분 종료'}</p><button onclick="home()">순위 보기</button></div>`} function openAdmin(){if(run&&!confirm('진행 중인 게임을 종료하고 관리자 화면으로 이동할까요? 현재 점수는 기록됩니다.'))return;if(run){if(Date.now()>=run.end)finish(false);else finish(false,true)}admin()} function admin(){clearInterval(tick);run=null;app.innerHTML=`<button class="secondary" onclick="home()">← 게임으로</button><div class="card"><h2>게임 관리</h2><div class="row"><select onchange="game=+this.value;admin()">${db.map((g,i)=>`<option value="${i}" ${i===game?'selected':''}>${esc(g.name)}</option>`).join('')}</select><button onclick="newGame()">새 게임 만들기</button><button class="secondary" onclick="renameGame()">이름 변경</button><button class="secondary" onclick="clearResults()">기록 초기화</button></div><p class="muted">변경사항은 이 브라우저에 저장됩니다. 이미지 버튼으로 각 제시어에 사진을 추가할 수 있습니다.</p></div><div class="card"><h2>그룹 관리</h2><button onclick="addGroup()">+ 그룹 추가</button></div>${db[game].groupNames.map((n,i)=>`<div class="card"><div class="row"><h2>${esc(n)} · ${db[game].groups[i].length}개</h2><button class="secondary" onclick="renameGroup(${i})">그룹 이름 변경</button><button class="secondary" onclick="deleteGroup(${i})">그룹 삭제</button></div><div style="overflow:auto"><table><tr><th>제시어</th><th>분류</th><th>난이도</th><th>비고</th><th>이미지</th><th></th></tr>${db[game].groups[i].map((w,j)=>`<tr><td><input value="${esc(w.text)}" onchange="edit(${i},${j},'text',this.value)"></td><td><input value="${esc(w.category)}" onchange="edit(${i},${j},'category',this.value)"></td><td><select onchange="edit(${i},${j},'difficulty',+this.value)">${[1,2,3].map(d=>`<option value="${d}" ${d==w.difficulty?'selected':''}>${'★'.repeat(d)}</option>`).join('')}</select></td><td><input value="${esc(w.note)}" onchange="edit(${i},${j},'note',this.value)"></td><td><label>📷<input type="file" accept="image/*" style="width:100px" onchange="upload(${i},${j},this)"></label>${w.image?'✓':''}</td><td><button class="secondary" onclick="removeWord(${i},${j})">삭제</button></td></tr>`).join('')}</table></div><button onclick="addWord(${i})">+ 제시어 추가</button></div>`).join('')}` } function edit(i,j,k,v){db[game].groups[i][j][k]=v;try{save()}catch(e){alert('저장 공간이 부족합니다. 이미지 크기를 줄여 주세요.')}} function upload(i,j,input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{edit(i,j,'image',r.result);admin()};r.readAsDataURL(f)} function addWord(i){db[game].groups[i].push({text:'새 제시어',category:'기타',difficulty:1,note:'',image:''});save();admin()} function removeWord(i,j){if(confirm('이 제시어를 삭제할까요?')){db[game].groups[i].splice(j,1);save();admin()}} function newGame(){let n=prompt('새 게임 이름');if(!n?.trim())return;db.push({name:n.trim(),groups:[[],[],[]],groupNames:[...defaultNames],results:[]});game=db.length-1;save();admin()} function addGroup(){let n=prompt('새 그룹 이름');if(!n?.trim())return;db[game].groupNames.push(n.trim());db[game].groups.push([]);save();admin()} function renameGroup(i){let n=prompt('그룹 이름',db[game].groupNames[i]);if(!n?.trim())return;db[game].groupNames[i]=n.trim();save();admin()} function deleteGroup(i){let g=db[game];if(!confirm(`‘${g.groupNames[i]}’ 그룹과 제시어 ${g.groups[i].length}개를 삭제할까요? 기존 순위 기록은 유지됩니다.`))return;g.groupNames.splice(i,1);g.groups.splice(i,1);save();admin()} function renameGame(){let n=prompt('게임 이름',db[game].name);if(n?.trim()){db[game].name=n.trim();save();admin()}} function clearResults(){if(confirm('이 게임의 모든 기록을 삭제할까요?')){db[game].results=[];save();admin()}} home();</script></html>
